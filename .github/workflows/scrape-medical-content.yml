name: Scrape Medical Content

on:
  workflow_dispatch:  # Manual trigger
  # schedule:
  #   - cron: '0 0 * * 0'  # Weekly on Sunday (uncomment to enable)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install scrapy
          pip install scrapy-playwright
          playwright install chromium
          playwright install-deps

      - name: Run md.cafe scraper
        working-directory: medical_scraper
        run: |
          scrapy crawl mdcafe_pw -s LOG_LEVEL=INFO
        continue-on-error: true

      - name: Run MSD Manuals scraper
        working-directory: medical_scraper
        run: |
          scrapy crawl msdmanuals_pw -s LOG_LEVEL=INFO
        continue-on-error: true

      - name: Commit scraped content
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Remove output from gitignore temporarily
          sed -i '/^output\//d' medical_scraper/.gitignore

          git add medical_scraper/output/
          git add medical_scraper/.gitignore

          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update scraped medical content [automated]"
          git push
